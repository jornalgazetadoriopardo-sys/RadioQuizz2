<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e11d48" />
    <title>Pergunta da Hora</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pergunta da Hora" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Se o app não abrir (navegador muito antigo ou erro), mostra um aviso em vez de tela em branco. -->
    <div id="aviso-navegador" style="display:none;font-family:system-ui,sans-serif;padding:32px 24px;text-align:center;color:#0f172a;background:#fff;min-height:100%">
      <p style="font-size:20px;font-weight:800;margin:40px 0 8px">Não foi possível abrir o quiz</p>
      <p style="font-size:15px;line-height:1.5;color:#475569;margin:0 0 20px">Atualize o sistema do celular ou abra o link em outro navegador (Chrome ou Safari atualizado).</p>
      <button onclick="location.reload()" style="background:#e11d48;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:15px;font-weight:700">Tentar de novo</button>
    </div>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root')
        if (!root || !root.firstChild) document.getElementById('aviso-navegador').style.display = 'block'
      }, 8000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
